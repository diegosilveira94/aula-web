<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenda Herby</title>
    <style>
        img {
            width: 200px;
            height: auto;
        }
        
        .principal-container {
            display: flex;
            flex-direction: row;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .container-form {
            display: flex;
            flex-direction: column;
        }

        h1 {
            border-bottom: 1px;
            border-color: grey;
        }

        button {
            width: 50%;
        }

        .resultados {
            font-weight: 500;
        }
        </style>
</head>
<body>
    <div class="principal-container">
        <img src="./image.png" alt="Fusca">
        <div class="container-form">
            <h1>Revenda Herbie - Consignados</h1>
            <div>
                <label for="modelo">Modelo do veículo</label>
                <input type="text" id="modelo">
            </div>
            <div>
                <label for="ano">Ano de Fabricação</label>
                <input type="number" id="ano">
            </div>
            <div>
                <label for="preco">Preço Proprietário R$</label>
                <input type="number" id="preco">
            </div>
            <div>
                <button id="btn">Classificar/Calcular Preço</button>
            </div>
        </div>
    </div>
    <section class="resultados">
        <p id="resultado1"></p>
        <p id="resultado2"></p>
    </section>
    <script src="./script.js"></script>
</body>
</html>
