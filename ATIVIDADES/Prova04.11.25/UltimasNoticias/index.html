<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Programa Últimas Notícias</title>
</head>
<body>
    <div class="principal-container">
        <img src="./image.png" alt="notebook">
        <div class="conteudo-container">
            <h1>Programa Últimas Notícias</h1>
            <div class="items-container">
                <label for="noticia">Notícia: </label>
                <input type="text" id="noticia">
            </div>
            <div class="items-container">
                <button id="btn-add">Adicionar</button>
                <button id="btn-listar">Listar Últimas Notícias</button>
            </div>
            <div>
                <p id="qtd-noticias">Notícias Cadastradas: </p>
            </div>
            <div>
                <p>3 Últimas Notícias</p>
                <p>-------------------------------------------------------</p>
                <p id="noticia1"></p>
                <p id="noticia2"></p>
                <p id="noticia3"></p>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
